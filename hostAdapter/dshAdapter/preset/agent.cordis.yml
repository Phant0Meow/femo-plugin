# The `femo-plugin` agent preset: a Femo script stage session.
#
# The session has a main model (dsh default): idle sessions converse/write
# scripts normally; while a script runs, the femo-plugin plugin rejects
# pre-step so the engine owns the conversation (the input bridge routes user
# text to human nodes / hard stop).
#
# Tools here are inherited by the femo-plugin SUBAGENTS (each Femo AI node runs
# as a fresh child under this preset): the child joins the parent's preset,
# so whatever is mounted here is what the script characters may call.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # 0.1.5 起 persona 行的 schema 是 { prefix, suffix, complete,
    # includeRuntimeContext }：prefix 必填（原 text 键已废弃）。
    # 占位符 {FEMO_ROOT}（femo 系统根目录）不在本文件解析——运行时才知道：
    # 插件安装 preset 落盘 dsh-home 前替换成真实根目录（host/preset-install.ts），
    # 模型看到的就是可直接使用的路径；femo:root section（host/persona.ts）
    # 另注入一行根路径声明兜底。
    # 2026-09-14：全文由作者定稿替换（bak-20260914-userfinal 为前一版）。
    # 2026-09-15：作者再次重写全文（章节化 markdown、五区逐字段讲解；
    # bak-20260915-rewrite 为前一版）。
    prefix: |-
      # FEMO模式

      zcode 等其他宿主各有自己的教条装配；本 persona 是 dsh 版：下面的通用教条
      正文由 preset-install 展开自公共文件 femo2host/femoGenConnector/SKILL.common.md
      （唯一份），dsh 特有补充见文末「dsh 版宿主补充」。

      你是 FEMO 模式的主Agent，同时也是用户在这个会话里的 AI 助手。
      你可以帮用户写femo脚本，或者使用femo脚本来帮用户完成需求。

      {{INCLUDE:femo2host/femoGenConnector/SKILL.common.md}}

      ## 附：dsh 版宿主补充

      - 空闲时：正常聊天，写脚本、调用工具、回答用户问题——和普通 dsh 会话一样。
      - 用户可以通过「视角菜单」切换到上帝视角/角色视角投影窗。
      - 主agent参与运行模式：你也可以参与FEMO脚本的运行实况（source:main 写法见通用正文 actors 节），那时你会收到femo流程中的上下文，并可以做出回应。
      - 过程导向的运行启动后，可提醒用户去FEMO标签页，或者对话标签页投影窗（如上帝视角）查看 femo 的运行实况。
      - 如果有 human 节点等用户输入，用户可以在上帝视角、FEMO内视角、他自己的角色视角以及FEMO标签页输入。
# ── tools available to Femo subagents ────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'

# ── compaction ──────────────────────────────────────────────────────────────
# 与 standard preset 同款三件套：/compact 命令 + 自动压力压缩 + 超长工具结果先剪。
# group + isolate realm 写法照抄 standard：compaction 服务是 entry 本地的，
# 不会与普通会话（standard preset）挂载的同名服务相撞；tokenMeter 留在 host
# 平面，此处只 resolve 不重挂（同 standard 的取舍）。
# pruner 阈值比 standard 默认（8192/4096/1024）调大：femo-script 返回的脚本
# 全文、femo-run 的输出是主Agent主模型需要完整看到的产物，8192 会把脚本中段剪掉；
# 65536 起剪，真超长的垃圾结果仍有防护。改动只影响此后新开的 femo 会话。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 65536
        headChars: 32768
        tailChars: 8192
