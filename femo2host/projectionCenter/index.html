<!DOCTYPE html>
<html lang="zh-CN" data-theme="porcelain">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>FEMO · 投影中心</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<!-- ═══════════════════════════════════════════════════════════════════
     拆分裁决（2026-09-26，见 docs/ActiveRoadmaps/投影页拆分施工清单.md）：
     本页从单文件拆进 projectionCenter/ 文件夹。hub 白名单伺候——GET / 三个
     别名回本页，资产走 /pc/<名字>，未命中 404。CSS 两层分居 theme.css（token）
     与 app.css（版式）；逻辑各司一模块，共享可变状态只在 state.mjs 的账本 S 上。
     旧「单文件在 http 与 file:// 下都活着」裁决随拆退役：file:// 兼容自共享
     规范件模块化起已名存实亡，现在正式放弃——页面请经 hub 打开。
     ═══════════════════════════════════════════════════════════════════ -->
<link rel="stylesheet" href="/pc/theme.css">
<link rel="stylesheet" href="/pc/app.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="runctl">
      <button type="button" class="topbtn iconbtn" id="startBtn" title="开始：用最近一次运行的剧本新开一局（读盘上现稿）">
        <span class="tb-ico"><svg viewBox="0 0 384 512" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M73 39c-14.7-9.1-33.4-9.5-48.5-.9S0 62.6 0 80V432c0 17.4 9.4 33.4 24.5 42.1s33.7 8.2 48.5-.9L361 297c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41L73 39z"/></svg></span>
      </button>
      <button type="button" class="topbtn iconbtn" id="resumeBtn" title="继续：续跑最近挂起的场（从断点接着走）">
        <span class="tb-ico"><svg viewBox="0 0 512 512" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M463.5 224H472c13.3 0 24-10.7 24-24V72c0-9.7-5.8-18.5-14.8-22.2s-19.3-1.7-26.2 5.2L413.4 96.6c-87.6-86.5-228.7-86.2-315.8 1c-87.5 87.5-87.5 229.3 0 316.8s229.3 87.5 316.8 0c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0c-62.5 62.5-163.8 62.5-226.3 0s-62.5-163.8 0-226.3c62.2-62.2 162.7-62.5 225.3-1L327 183c-6.9 6.9-8.9 17.2-5.2 26.2s12.5 14.8 22.2 14.8H463.5z"/></svg></span>
      </button>
      <button type="button" class="topbtn iconbtn" id="stopBtn" title="停止：挂起当前在跑的场（断点保留，可继续）">
        <span class="tb-ico"><svg viewBox="0 0 384 512" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M0 128C0 92.7 28.7 64 64 64H320c35.3 0 64 28.7 64 64V384c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V128z"/></svg></span>
      </button>
    </span>
    <button type="button" class="topbtn" id="themeToggle" aria-pressed="false" title="切换主题（剧场 / 素瓷 / 翡翠）">
      <span class="tb-ico"><svg viewBox="0 0 512 512" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M448 256c0-106-86-192-192-192v384c106 0 192-86 192-192zM0 256a256 256 0 1 0 512 0A256 256 0 1 0 0 256z"/></svg></span>
      <span class="tb-txt" id="themeToggleTxt">素瓷</span>
    </button>

    <button type="button" class="topbtn" id="pageReload" title="刷新页面">
      <span class="tb-ico"><svg viewBox="0 0 512 512" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M105.1 202.6c7.7-21.8 20.2-42.3 37.8-59.8c62.5-62.5 163.8-62.5 226.3 0L386.3 160 352 160c-17.7 0-32 14.3-32 32s14.3 32 32 32l111.5 0c0 0 0 0 0 0l.4 0c17.7 0 32-14.3 32-32l0-112c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 35.2L414.4 97.6c-87.5-87.5-229.3-87.5-316.8 0C73.2 122 55.6 150.7 44.8 181.4c-5.9 16.7 2.9 34.9 19.5 40.8s34.9-2.9 40.8-19.5zM39 289.3c-5 1.5-9.8 4.2-13.7 8.2c-4 4-6.7 8.8-8.1 14c-.3 1.2-.6 2.5-.8 3.8c-.3 1.7-.4 3.4-.4 5.1L16 432c0 17.7 14.3 32 32 32s32-14.3 32-32l0-35.1 17.6 17.5c0 0 0 0 0 0c87.5 87.4 229.3 87.4 316.7 0c24.4-24.4 42.1-53.1 52.9-83.8c5.9-16.7-2.9-34.9-19.5-40.8s-34.9 2.9-40.8 19.5c-7.7 21.8-20.2 42.3-37.8 59.8c-62.5 62.5-163.8 62.5-226.3 0l-.1-.1L125.6 352l34.4 0c17.7 0 32-14.3 32-32s-14.3-32-32-32L48.4 288c-1.6 0-3.2 .1-4.8 .3s-3.1 .5-4.6 1z"/></svg></span>
      <span class="tb-txt">刷新</span>
    </button>
    <span style="flex:1"></span>
    <div class="dbg-wrap" id="dbgWrap">
      <button type="button" class="topbtn" id="dbgBtn" aria-pressed="false">
        <span class="tb-ico"><svg viewBox="0 0 576 512" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M9.4 86.6C-3.1 74.1-3.1 53.9 9.4 41.4s32.8-12.5 45.3 0l192 192c12.5 12.5 12.5 32.8 0 45.3l-192 192c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L178.7 256 9.4 86.6zM256 416H544c17.7 0 32 14.3 32 32s-14.3 32-32 32H256c-17.7 0-32-14.3-32-32s14.3-32 32-32z"/></svg></span>
        <span class="tb-txt">print</span><span class="tb-badge cnt" id="dbgCnt">0</span>
      </button>
      <div class="dbg-panel" id="dbgPanel">
        <div class="dbg-head">
          <span>print / stderr · 桥进程旁路（只读镜像）</span><span class="sp"></span>
          <button id="dbgCopy" type="button">复制</button>
          <button id="dbgClear" type="button">清空</button>
        </div>
        <div class="dbg-body" id="dbgBody"><div class="dbg-empty">暂无 print。</div></div>
      </div>
    </div>
  </div>
  <div class="kicker">Projection Center</div>
  <h1>视角窗口<span class="amp"> · </span>投影中心</h1>
  <div class="console">
    <span class="conn" id="conn"><span class="dot"></span><span id="connText">连接中… ws://127.0.0.1:8765</span></span>
    <span class="ctl"><span>Job</span><span class="dd" id="jobDD"><button type="button" class="dd-btn" id="jobDDBtn"><span class="dd-label">最新</span></button><div class="dd-menu" id="jobDDMenu" hidden></div></span></span>
    <span class="ctl"><span>视角</span><span class="dd" id="viewDD"><button type="button" class="dd-btn" id="viewDDBtn"><span class="dd-label">上帝视角</span></button><div class="dd-menu" id="viewDDMenu" hidden></div></span></span>
    <span class="meta2" id="jobMeta"></span>
  </div>
  <div class="sesspanel" id="sessPanel">
    <button type="button" class="sesspanel-head" id="sessPanelHead" aria-controls="sessPanelBody" aria-expanded="false">
      <span class="sesspanel-title">主会话</span>
      <span class="sesspanel-hint">每接入宿主一行 · 选中即换主 session，上帝窗跟随</span>
      <span class="sesspanel-caret" aria-hidden="true"></span>
    </button>
    <div class="sesspanel-body" id="sessPanelBody"></div>
  </div>
  <!-- 已退役-遥测带（2026-10-03 用户拍板「我们不需要显示它」）：Job/视角/语义行
       计数行整行退场。render.mjs 里的取元素与填充段已同批注释——只注释 DOM 不注释
       填充代码，elStats 空引用会炸掉每轮渲染（夹具时代踩过的老病）。
       恢复 = 解注本处与 render.mjs 两处，共三块。 -->
  <!-- <div class="stats" id="stats"></div> -->
  <div class="tl" id="tl"></div>
  <!-- 人类席停靠容器（2026-10-03 拆分）：与主轨（#tl）分开重绘——上面节点更新/
       流式增量只重写 #tl，停靠席里的输入框全程不被拆建，聚焦/输入法组词不受
       流式输出打扰。容器常年存在，空=没有等待中的人类席。 -->
  <div class="dock" id="dock"></div>
  <!-- 人类席输入只留对话流里的席位内联输入席（render.mjs doingHtml 画）——
       底部固定输入框已退役（2026-10-02 用户拍板：对话流里已经有了，最下面
       不需要再来一口）。交卷逻辑仍在 composer.mjs，两口并一口。 -->
  </div>
  <div class="tailbar">
    <button type="button" class="topbtn" id="pageReloadBottom" title="刷新页面（刷新后保持贴底跟随）">
      <span class="tb-ico"><svg viewBox="0 0 512 512" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M105.1 202.6c7.7-21.8 20.2-42.3 37.8-59.8c62.5-62.5 163.8-62.5 226.3 0L386.3 160 352 160c-17.7 0-32 14.3-32 32s14.3 32 32 32l111.5 0c0 0 0 0 0 0l.4 0c17.7 0 32-14.3 32-32l0-112c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 35.2L414.4 97.6c-87.5-87.5-229.3-87.5-316.8 0C73.2 122 55.6 150.7 44.8 181.4c-5.9 16.7 2.9 34.9 19.5 40.8s34.9-2.9 40.8-19.5zM39 289.3c-5 1.5-9.8 4.2-13.7 8.2c-4 4-6.7 8.8-8.1 14c-.3 1.2-.6 2.5-.8 3.8c-.3 1.7-.4 3.4-.4 5.1L16 432c0 17.7 14.3 32 32 32s32-14.3 32-32l0-35.1 17.6 17.5c0 0 0 0 0 0c87.5 87.4 229.3 87.4 316.7 0c24.4-24.4 42.1-53.1 52.9-83.8c5.9-16.7-2.9-34.9-19.5-40.8s-34.9 2.9-40.8 19.5c-7.7 21.8-20.2 42.3-37.8 59.8c-62.5 62.5-163.8 62.5-226.3 0l-.1-.1L125.6 352l34.4 0c17.7 0 32-14.3 32-32s-14.3-32-32-32L48.4 288c-1.6 0-3.2 .1-4.8 .3s-3.1 .5-4.6 1z"/></svg></span>
      <span class="tb-txt">刷新 · 贴底</span>
    </button>
  </div>
<!-- 滚到底/回顶一对圆钮（2026-10-04 对称加设回顶钮）：皮肤同款、位置镜像——
     回底在右下（bottom:18px）、回顶在右上（top:18px），各自的尽头自动隐藏。 -->
<button class="jump-top" id="jumpTop" type="button" title="滚到顶部" hidden></button>
<button class="jump-btm" id="jumpBtm" type="button" title="滚到底部" hidden></button>
<script type="module" src="/pc/main.mjs"></script>
</body>
</html>
